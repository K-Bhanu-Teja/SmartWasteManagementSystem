<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Smart Waste Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="site-title">SWMS — Login</h1>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="#">About</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container" style="padding:2rem 0;max-width:480px">
      <h2>Sign in</h2>
      <form>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required style="display:block;width:100%;padding:0.5rem;margin:0.5rem 0;border-radius:6px;border:1px solid #ddd">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required style="display:block;width:100%;padding:0.5rem;margin:0.5rem 0;border-radius:6px;border:1px solid #ddd">

        <button type="submit" style="background:var(--accent);color:white;border:none;padding:0.6rem 1rem;border-radius:6px;cursor:pointer">Login</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; Smart Waste Management System</p>
    </div>
  </footer>

</body>
</html>
